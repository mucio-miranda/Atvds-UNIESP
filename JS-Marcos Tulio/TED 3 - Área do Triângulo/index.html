<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Triângulo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Área do Triângulo</h1>

        <label for="base">Base</label>
        <input type="number" id="base" placeholder="Ex: 10" step="any">

        <label for="altura">Altura</label>
        <input type="number" id="altura" placeholder="Ex: 5" step="any">

        <button id="btnCalcular">Calcular</button>

        <div id="resultado"></div>

        <p class="formula">Fórmula: Área = (base × altura) ÷ 2</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
